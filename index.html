<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>점프UP 코디</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e5fd4">
<style>body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F2F4F8;color:#6B7280;display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;}</style>
</head>
<body>
<p id="msg">불러오는 중…</p>
<script>
/* ===== 점프UP 코디 (통합 이전 기간용) =====
   이 앱의 실제 코드는 코웨이 통합관리(/coway-app/) 안에 있습니다.
   여기서는 그 코드를 받아 그대로 실행만 합니다.
   - 코드 수정은 통합관리 index.html 한 곳에서만 하면 이 주소에도 자동 반영
   - 데이터는 같은 주소(thedeveljun.github.io) 저장소를 함께 사용 */
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});}
(function(){
  var SRC='/coway-app/', ID='src-cody', CACHE='app_src_cody';
  var HEAD='<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">';
  function unesc(t){return t.replace(/^\n/,'').replace(/<\\\/script/g,'</script').replace(/<\\!--/g,'<!--');}
  function run(html){
    html=html.replace('</head>',HEAD+'</head>');
    document.open();document.write(html);document.close();
  }
  fetch(SRC+'?v='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
    .then(function(page){
      var el=new DOMParser().parseFromString(page,'text/html').getElementById(ID);
      if(!el) throw new Error('source missing');
      var html=unesc(el.textContent);
      try{localStorage.setItem(CACHE,html);}catch(e){}
      run(html);
    })
    .catch(function(){
      var c=null;try{c=localStorage.getItem(CACHE);}catch(e){}
      if(c){run(c);return;}
      document.getElementById('msg').innerHTML='앱을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 열어 주세요.';
    });
})();
</script>
</body>
</html>
